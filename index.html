<body>
<div id="app"></div>
<script>
'use strict';
/* ============================================================
   Bingo Party — ملف واحد للعبة كاملة
   فردي ضد الكومبيوتر + أونلاين مع الصاحبات (كود غرفة + شات)
   ============================================================ */

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const rnd = n => Math.floor(Math.random() * n);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- game constants ---------- */
const LETTERS = ['B','I','N','G','O'];
const letterFor = n => LETTERS[Math.floor((n-1)/5)];
const LCOLOR = { B:'#8b5cf6', I:'#ec4899', N:'#f97316', G:'#22c55e', O:'#eab308' };
const LINES = (() => {
  const L = [];
  for(let r=0;r<5;r++) L.push([0,1,2,3,4].map(c => r*5+c));
  for(let c=0;c<5;c++) L.push([0,1,2,3,4].map(r => r*5+c));
  L.push([0,6,12,18,24]); L.push([4,8,12,16,20]);
  return L;
})();
const countLines = m => LINES.reduce((n,l) => n + (l.every(i => m[i]) ? 1 : 0), 0);
function bestLine(m){
  let best = null;
  for(const l of LINES){ if(l.every(i=>m[i])) continue;
    const miss = l.filter(i=>!m[i]).length;
    if(!best || miss < best.miss) best = { line:l, miss }; }
  return best;
}
function genCard(){
  const cells = new Array(25);
  for(let col=0; col<5; col++){
    const nums = shuffle([1,2,3,4,5].map(x => x + col*5));
    for(let row=0; row<5; row++){
      const idx = row*5 + col;
      cells[idx] = idx === 12 ? { n:0, c:'N' } : { n:nums[row], c:LETTERS[col] };
    }
  }
  return cells;
}
const mkMarked = () => { const m = new Array(25).fill(false); m[12] = true; return m; };
const range25 = () => Array.from({length:25}, (_,i) => i+1);

const MODES = {
  classic:   { title:'كلاسيك بينجو', icon:'🎱', interval:4000, pattern:'bingo5',    desc:'كل خط بياخد حرف… و٥ خطوط = بينجو!' },
  quick:     { title:'كويك بينجو',   icon:'⚡', interval:2200, pattern:'bingo5',    desc:'نفس اللعبة بس أسرع — كرة كل ثانيتين' },
  fullhouse: { title:'فول هاوس',     icon:'🏠', interval:3200, pattern:'fullhouse', desc:'علّمي كل الخانات (٢٤ رقم) لتكسبي' },
};
const PATTERNS = { bingo5:'كل خط بيقفل = حرف… و٥ حروف BINGO = كسبتي!', fullhouse:'علّمي كل خانات الكارت (٢٤ رقم)' };
const EMOTES = ['🎉','😱','🔥','😂','👀','🍀','💔','🏆','🙏','💃'];
const AVATARS = ['🎉','🐱','🦄','🐸','🐰','🐼','🐯','🐨','🦋','🐤','🐶','⭐','🎀','🍭','👑'];

/* ---------- profile (localStorage) ---------- */
const DEFAULT_PROFILE = { name:'', avatar:'🎉', coins:0, xp:0, wins:0, games:0, autoMark:true, sound:true, streak:0, lastDaily:'' };
let profile = { ...DEFAULT_PROFILE };
try { const s = localStorage.getItem('bp-profile'); if(s) profile = { ...DEFAULT_PROFILE, ...JSON.parse(s) }; } catch(e){}
function saveProfile(){ try { localStorage.setItem('bp-profile', JSON.stringify(profile)); } catch(e){} }
function levelFromXp(xp){
  let level = 1, rest = xp;
  while(rest >= 120 + (level-1)*80 && level < 60){ rest -= 120 + (level-1)*80; level++; }
  return { level, into:rest, need:120 + (level-1)*80 };
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addReward(xp, coins){
  const before = levelFromXp(profile.xp).level;
  profile.xp += xp; profile.coins += coins;
  const after = levelFromXp(profile.xp).level;
  saveProfile();
  return after > before; // leveled up?
}

/* ---------- sfx (WebAudio, no files) ---------- */
let actx = null;
function ctx(){ if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume(); return actx; }
function tone(f, dur, type='sine', gain=.16, when=0, slide=0){
  if(!profile.sound) return;
  try {
    const c = ctx(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
  } catch(e){}
}
const sfx = {

/* ---------- toast & confetti ---------- */
let toastTimer = null;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const d = document.createElement('div');
  d.className = 'toast pop'; d.textContent = msg;
  document.body.appendChild(d);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => d.remove(), 2600);
}
function confetti(){
  const colors = ['#ec4899','#8b5cf6','#f59e0b','#22c55e','#eab308','#f97316','#fff'];
  for(let i=0;i<80;i++){
    const s = document.createElement('span');
    s.className = 'confetti';
    const size = 6 + rnd(9);
    s.style.cssText = `left:${rnd(100)}%;width:${size}px;height:${size*(Math.random()>.6?1:1.6)}px;background:${colors[i%colors.length]};border-radius:${Math.random()>.6?'50%':'2px'};animation-duration:${2.4+rnd(20)/10}s;animation-delay:${rnd(22)/10}s`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 5500);
  }
}
/* ============================================================
   Shared UI builders
   ============================================================ */
function ballHTML(n, letter, size){
  const l = letter || letterFor(n);
  const inner = Math.round(size * .66);
  const fs = Math.round(size * (n >= 10 ? .3 : .38));
  return `<div class="ball" style="--bc:${LCOLOR[l]};width:${size}px;height:${size}px"><i style="width:${inner}px;height:${inner}px;font-size:${fs}px">${n}</i></div>`;
}
function trackerHTML(lines, sm){
  const got = Math.max(0, Math.min(5, lines));
  return `<div class="tracker${sm ? ' sm' : ''}" aria-label="حروف بينجو: ${got} من 5">${LETTERS.map((l,i) =>
    `<div class="tletter${i < got ? ' got' : ''}" ${i < got ? `style="background:linear-gradient(160deg,${LCOLOR[l]},${LCOLOR[l]}cc);box-shadow:0 3px 10px ${LCOLOR[l]}55"` : ''}>${l}</div>`).join('')}</div>`;
}
function cardHTML(card, marked, opts){
  opts = opts || {};
  let h = `<div class="bcard ${opts.shake ? 'shake' : ''}" id="bcard" dir="ltr"><div class="bhead">${LETTERS.map(l => `<div>${l}</div>`).join('')}</div><div class="bgrid">`;
  card.forEach((cell, i) => {
    const m = marked[i];
    const win = (opts.winCells || []).includes(i);
    h += `<div class="bcell${win ? ' wincell' : ''}" data-i="${i}">`;
    h += cell.n === 0 ? '<span class="free">⭐</span>' : `<span>${cell.n}</span>`;
    if(m) h += `<span class="bmark">${cell.n === 0 ? '⭐' : cell.n}</span>`;
    h += `</div>`;
  });
  h += `</div></div>`;
  return h;
}
/** add/remove the "called" glow on unmarked cells whose number was drawn */
function refreshCalledGlow(state){
  const called = new Set((state.balls || []).map(b => b.n));
  state.card.forEach((c, i) => {
    const el = state.root.querySelector(`.bcell[data-i="${i}"]`);
    if(!el) return;
    const should = state.manual && c.n !== 0 && called.has(c.n) && !state.marked[i];
    el.classList.toggle('called', !!should);
  });
}

class GameUI {
  constructor(cfg, handlers){
    this.cfg = cfg; this.h = handlers;
    this.powerups = { hint:1, lucky:1, double:1 };
    this.doubleActive = false;
    this.locked = false; this.done = false; this.readyNotified = false;
    this.unread = 0; this.balls = [];
    this.render();
  }
  render(){
    app.innerHTML = gameScreenHTML(this.cfg);
    this.root = $('#gscr');
    this.cardWrap = $('#gcardwrap');
    this.renderPowerups();
    $('#gback').onclick = () => { sfx.click(); this.h.onBack(); };
    $('#gtoggle').onclick = () => { sfx.click(); this.h.onToggleAuto(); };
    $('#gbingo').onclick = () => this.pressBingo();
  }
  setCard(card, marked){
    this.card = card; this.marked = marked;
    this.cardWrap.innerHTML = cardHTML(card, marked);
    this.cardWrap.querySelectorAll('.bcell').forEach(el => {
      el.addEventListener('click', () => {
        const i = +el.dataset.i;
        if(this.marked[i] || this.card[i].n === 0) return;
        this.h.onCellTap(i, el);
      });
    });
    this.updateModeChip();
  }
  updateModeChip(){
    this.manual = !this.cfg.autoMark();
    $('#gmodechip').textContent = this.manual ? 'شطبي بنفسك ✍️' : 'تعليم تلقائي 🤖';
    $('#gtoggle').textContent = this.manual ? 'حوّل لتلقائي' : 'حوّل ليدوي';
    refreshCalledGlow(this);
  }
  markCell(i){
    if(!this.card || this.marked[i] || this.card[i].n === 0) return false;
    this.marked[i] = true;
    const el = this.cardWrap.querySelector(`.bcell[data-i="${i}"]`);
    if(el){
      el.classList.remove('called');
      const span = document.createElement('span');
      span.className = 'bmark';
      span.textContent = this.card[i].n === 0 ? '⭐' : this.card[i].n;
      el.appendChild(span);
    }
    return true;
  }
  onBall(n, letter){
    this.balls.push({ n, letter });
    $('#gball').innerHTML = `<div class="ball-in" style="display:flex;align-items:center;gap:10px">${ballHTML(n, letter, 88)}<span style="font-size:34px;font-weight:900;color:${LCOLOR[letter]};font-family:Arial,sans-serif">${letter}-${n}</span></div>`;
    const strip = $('#gstrip');
    const b = document.createElement('div');
    b.style.opacity = '1';
    b.innerHTML = ballHTML(n, letter, 34);
    strip.prepend(b);
    while(strip.children.length > 12) strip.lastChild.remove();
    [...strip.children].forEach((c, i) => c.style.opacity = i === 0 ? '1' : '.5');
    $('#gremain').textContent = Math.max(0, 25 - this.h.ballCount());
    sfx.pop();
    refreshCalledGlow(this);
  }
  onLines(lines){
    const prev = this._lines || 0;
    this._lines = lines;
    $('#gtracker').innerHTML = trackerHTML(lines);
    $('#glines').textContent = Math.min(lines, 5);
    if(lines > prev) sfx.line();
    if(this.cfg.pattern === 'bingo5' && lines >= 5 && !this.readyNotified){
      this.readyNotified = true;
      this.setBingoReady();
    }
    this.updateChips && this.updateChips();
  }
  myLines(){ return this._lines || 0; }
  canBingo(){
    if(!this.marked) return false;
    return this.cfg.pattern === 'bingo5' ? countLines(this.marked) >= 5 : this.marked.every(Boolean);
  }
  setBingoReady(){
    const b = $('#gbingo');
    b.classList.add('pulse');
    b.style.background = 'linear-gradient(to left,#22c55e,#4ade80)';
    sfx.magic();
    if(this.cfg.pattern === 'bingo5') toast('كمّلتي حروف BINGO! دوسي الزرار! 🚨');
  }
  pressBingo(){
    if(this.done || this.locked) return;
    const ok = this.h.onBingo();
    if(ok === 'pending') return; // online: waiting for host validation
    if(ok){
      this.done = true;
      $('#gbingo').disabled = true;
    } else this.bingoInvalid();
  }
  bingoInvalid(){
    const lines = this.cfg.pattern === 'bingo5' ? countLines(this.marked) : this.marked.filter(Boolean).length;
    const msg = this.cfg.pattern === 'bingo5'
      ? `لسه ناقصك ${Math.max(1, 5 - lines) === 1 ? 'خط واحد' : (5 - lines) + ' خطوط'}! ✋`
      : 'لسه مكمّلتش كل الخانات! ✋';
    const bm = $('#gbingomsg');
    bm.innerHTML = `<div class="bmsg pop">${msg}</div>`;
    $('#bcard').classList.add('shake');
    this.locked = true; sfx.buzz();
    setTimeout(() => { bm.innerHTML = ''; $('#bcard').classList.remove('shake'); }, 900);
    setTimeout(() => this.locked = false, 3000);
  }
  renderPowerups(){
    const defs = [
      { k:'hint', icon:'💡', t:'تلميحة' },
      { k:'lucky', icon:'🍀', t:'مارك حظ' },
      { k:'double', icon:'✨', t:'نقاط ×2' },
    ];
    $('#gpwr').innerHTML = defs.map(d => {
      const off = this.powerups[d.k] <= 0 || (d.k === 'lucky' && this.cfg.pattern === 'fullhouse') || this.done;
      const active = d.k === 'double' && this.doubleActive;
      return `<button class="pwr${off ? ' off' : ''}" data-k="${d.k}">
        <span style="font-size:22px">${d.icon}</span>
        <span style="font-size:11px;font-weight:800">${active ? 'فعّالة ×2' : d.t}</span>
        ${this.powerups[d.k] > 0 ? `<b>${this.powerups[d.k]}</b>` : ''}
      </button>`;
    }).join('');
    $('#gpwr').querySelectorAll('.pwr').forEach(b => b.onclick = () => this.usePowerup(b.dataset.k));
  }
  usePowerup(k){
    if(this.powerups[k] <= 0 || this.done || (k === 'lucky' && this.cfg.pattern === 'fullhouse')) return;
    const res = this.h.onPowerup(k);
    if(res === false) return;
    this.powerups[k]--;
    if(k === 'double') this.doubleActive = true;
    sfx.magic();
    this.renderPowerups();
  }
  showHint(line){
    line.forEach(i => {
      const el = this.cardWrap.querySelector(`.bcell[data-i="${i}"]`);
      if(el && !this.marked[i]) el.style.boxShadow = '0 0 0 3px #fde047, 0 0 12px #fde04788';
    });
    setTimeout(() => line.forEach(i => {
      const el = this.cardWrap.querySelector(`.bcell[data-i="${i}"]`);
      if(el) el.style.boxShadow = '';
    }), 4000);
  }
  markLucky(cell){
    if(this.markCell(cell)) refreshCalledGlow(this);
  }
  setWinCells(cells){
    (cells || []).forEach(i => {
      const el = this.cardWrap.querySelector(`.bcell[data-i="${i}"]`);
      if(el) el.classList.add('wincell');
    });
  }
  /* --- chat (online only) --- */
  ensureChatBtn(){
    if($('#chatbtn')) return;
    const b = document.createElement('button');
    b.className = 'chatbtn glass'; b.id = 'chatbtn'; b.setAttribute('aria-label','الشات');
    b.innerHTML = `💬<b id="chatunread" style="display:none">0</b>`;
    b.onclick = () => { sfx.click(); this.toggleChat(true); };
    document.body.appendChild(b);
  }
  removeChatBtn(){ $('#chatbtn')?.remove(); this.closeChat(); }
  toggleChat(open){
    if(open){
      this.unread = 0; this.updateUnread();
      const w = document.createElement('div');
      w.className = 'chatwrap'; w.id = 'chatwrap';
      w.innerHTML = `<div class="dim"></div>
        <div class="chatbox slide-up">
          <div class="chatpanel glass">
            <div class="chathead">💬 شات الغرفة <button id="chatclose" style="margin-inline-start:auto;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);font-size:15px">✕</button></div>
            <div class="chatmsgs" id="chatmsgs"></div>
            <div class="emorerow">${EMOTES.map(e => `<button data-e="${e}">${e}</button>`).join('')}</div>
            <div class="chatinput">
              <input id="chatinput" maxlength="200" placeholder="اكتبيلهم حاجة…">
              <button class="btn btn-main" id="chatsend" style="min-height:42px;padding:8px 16px;font-size:14px">إرسال</button>
            </div>
          </div>
        </div>`;
      document.body.appendChild(w);
      w.querySelector('.dim').onclick = () => this.toggleChat(false);
      $('#chatclose').onclick = () => this.toggleChat(false);
      const send = () => {
        const v = $('#chatinput').value.trim();
        if(v){ this.h.onChat(v); $('#chatinput').value = ''; }
      };
      $('#chatsend').onclick = send;
      $('#chatinput').addEventListener('keydown', e => e.key === 'Enter' && send());
      w.querySelectorAll('[data-e]').forEach(b => b.onclick = () => this.h.onEmote(b.dataset.e));
      this.renderChat();
    } else this.closeChat();
  }
  closeChat(){ $('#chatwrap')?.remove(); }
  pushChat(m){
    this.chatMsgs = this.chatMsgs || [];
    this.chatMsgs.push(m);
    if(this.chatMsgs.length > 120) this.chatMsgs.shift();
    const box = $('#chatmsgs');
    if(box){
      box.insertAdjacentHTML('beforeend', chatMsgHTML(m, this.cfg.myId));
      box.scrollTop = box.scrollHeight;
      if(m.kind === 'emote' && m.pid !== this.cfg.myId){
        const d = document.createElement('div');
        d.className = 'emotefly';
        d.innerHTML = `<span class="av">${esc(m.avatar)}</span><span class="em">${esc(m.text)}</span>`;
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 1700);
      }
    } else if(m.kind !== 'system' && m.pid !== this.cfg.myId){
      this.unread++; this.updateUnread();
    }
  }
  renderChat(){
    const box = $('#chatmsgs');
    if(!box) return;
    box.innerHTML = (this.chatMsgs || []).map(m => chatMsgHTML(m, this.cfg.myId)).join('');
    box.scrollTop = box.scrollHeight;
  }
  updateUnread(){
    const u = $('#chatunread');
    if(u){ u.style.display = this.unread > 0 && !$('#chatwrap') ? 'flex' : 'none'; u.textContent = this.unread > 9 ? '+9' : this.unread; }
  }
  setAvatars(players){
    const el = $('#gavstrip');
    if(el) el.innerHTML = players.slice(0,5).map(p => `<span title="${esc(p.name)}" style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px">${p.avatar}</span>`).join('');
  }
  setChips(players, myId){
    const el = $('#gchips');
    if(!el) return;
    el.innerHTML = players.map(p => `
      <div style="flex-shrink:0;display:flex;align-items:center;gap:6px;border-radius:12px;padding:5px 9px;${p.id === myId ? 'background:rgba(236,72,153,.25);outline:1px solid rgba(244,114,182,.5)' : 'background:rgba(255,255,255,.08)'}">
        <span style="font-size:15px">${p.avatar}</span>
        <span style="font-size:11px;font-weight:800;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>
        ${p.won ? '<span style="font-size:11px">🏆</span>' : `<span class="progchip${p.lines >= 5 ? ' ready' : ''}">${Math.min(p.lines,5)}/5</span>`}
      </div>`).join('');
  }
  finish(){ this.done = true; $('#gbingo').disabled = true; this.removeChatBtn(); }
}

function chatMsgHTML(m, myId){
  if(m.kind === 'system') return `<div class="csys">✦ ${esc(m.text)}</div>`;
  if(m.kind === 'emote') return `<div class="cemote"><small style="display:block;font-size:10px;color:rgba(255,255,255,.4)">${esc(m.avatar)} ${esc(m.name)}</small>${esc(m.text)}</div>`;
  const mine = m.pid === myId;
  return `<div class="cmsg${mine ? ' mine' : ''}">
    <span style="font-size:20px;line-height:1;margin-top:3px">${esc(m.avatar)}</span>
    <div class="bub">${mine ? '' : `<small>${esc(m.name)}</small>`}<p>${esc(m.text)}</p></div>
  </div>`;
}

/* ============================================================
   Solo game — أنا ضد الكومبيوتر
   ============================================================ */
let solo = null;
function startSolo(modeKey){
  const cfg = MODES[modeKey];
  solo = new SoloGame(modeKey);
  solo.start();
}
class SoloGame {
  constructor(modeKey){
    this.modeKey = modeKey;
    this.cfg = MODES[modeKey];
    this.card = genCard();
    this.marked = mkMarked();
    this.bot = { name:'الكومبيوتر', avatar:'🤖', card:genCard(), marked:mkMarked(), winScheduled:false };
    this.pool = shuffle(range25());
    this.idx = 0; this.balls = [];
    this.ui = new GameUI(
      { ...this.cfg, roundTxt:'', autoMark: () => profile.autoMark, myId:'me' },
      {
        onBack: () => { this.stop(); solo = null; goHome(); },
        onToggleAuto: () => { profile.autoMark = !profile.autoMark; saveProfile(); this.ui.updateModeChip(); },
        onCellTap: i => this.tap(i),
        onBingo: () => this.tryBingo(),
        onPowerup: k => this.powerup(k),
        ballCount: () => this.balls.length,
      }
    );
    this.ui.setCard(this.card, this.marked);
    this.ui.setAvatars([{ id:'me', name:profile.name, avatar:profile.avatar }, { id:'bot', name:'الكومبيوتر', avatar:'🤖' }]);
  }
  start(){
    this.timer = setInterval(() => this.tick(), this.cfg.interval);
    setTimeout(() => !this.ended && this.tick(), 900);
  }
  stop(){ this.ended = true; if(this.timer) clearInterval(this.timer); }
  tick(){
    if(this.ended) return;
    if(this.idx >= this.pool.length){ this.finish({ won:false, noWinner:true }); return; }
    const n = this.pool[this.idx], letter = letterFor(n);
    this.balls.push({ n, letter }); this.idx++;
    this.ui.onBall(n, letter);
    if(profile.autoMark){
      const c = this.card.findIndex(x => x.n === n);
      if(c >= 0 && !this.marked[c]){ this.ui.markCell(c); this.marked[c] = true; }
    }
    const b = this.bot.card.findIndex(x => x.n === n);
    if(b >= 0) this.bot.marked[b] = true;
    this.ui.onLines(countLines(this.marked));
    // computer presses BINGO when it completes its letters
    const botWon = this.cfg.pattern === 'bingo5' ? countLines(this.bot.marked) >= 5 : this.bot.marked.every(Boolean);
    if(botWon && !this.bot.winScheduled){
      this.bot.winScheduled = true;
      setTimeout(() => { if(!this.ended) this.finish({ won:false, winner:'الكومبيوتر 🤖' }); }, 1500 + rnd(2500));
    }
    if(this.idx >= this.pool.length){
      setTimeout(() => { if(!this.ended) this.finish({ won:false, noWinner:true }); }, this.cfg.interval + 2000);
    }
  }
  tap(i){
    if(this.ended || profile.autoMark) return;
    const n = this.card[i].n;
    if(!n || this.marked[i]) { sfx.click(); return; }
    if(!this.balls.some(b => b.n === n)){ sfx.click(); toast('الرقم ده لسه ماتقالش ✋'); return; }
    this.marked[i] = true;
    this.ui.markCell(i);
    this.ui.onLines(countLines(this.marked));
  }
  tryBingo(){
    if(this.ended) return false;
    const ok = this.cfg.pattern === 'bingo5' ? countLines(this.marked) >= 5 : this.marked.every(Boolean);
    if(ok){ this.stop(); this.finish({ won:true }); return true; }
    return false;
  }
  powerup(k){
    if(k === 'hint'){
      const bl = bestLine(this.marked);
      if(!bl) return false;
      this.ui.showHint(bl.line);
    } else if(k === 'lucky'){
      if(this.cfg.pattern === 'fullhouse') return false;
      const cands = this.marked.map((m,i) => (!m && this.card[i].n !== 0) ? i : -1).filter(i => i >= 0);
      if(!cands.length) return false;
      const cell = cands[rnd(cands.length)];
      this.marked[cell] = true;
      this.ui.markLucky(cell);
      this.ui.onLines(countLines(this.marked));
    }
    return true;
  }
  finish(r){
    if(this.ended && !r.won) return;
    this.stop();
    this.ui.finish();
    const lines = countLines(this.marked);
    let xp = 0, coins = 0, title = '', emoji = '💔';
    if(r.won){
      xp = 30 + Math.min(lines,8)*2 + (this.cfg.pattern === 'fullhouse' ? 30 : 0);
      coins = 60 + (this.cfg.pattern === 'fullhouse' ? 50 : 0);
      if(this.ui.doubleActive){ xp *= 2; coins *= 2; }
      title = 'بينجووو! كسبتي ضد الكومبيوتر!'; emoji = '🏆';
      sfx.win(); confetti(); profile.wins++;
    } else if(r.noWinner){
      xp = 8; coins = 10; title = 'خلصت الكرات! تعادل 😅'; emoji = '🤝'; sfx.buzz();
    } else {
      xp = 8 + Math.min(lines,8)*2; coins = 10;
      title = `${r.winner} كسبت الجولة!`; sfx.buzz();
    }
    profile.games++;
    const leveled = addReward(xp, coins);
    showResult({ won:r.won, noWinner:r.noWinner, title, emoji, xp, coins, lines, leveled, onRestart:() => { solo = null; startSolo(this.modeKey); }, onHome:() => { solo = null; goHome(); } });
  }
}

/* ---------- HOST ---------- */
class HostMP {
  constructor(){
    this.isHost = true;
    this.code = genCode();
    this.myId = 'host';
    this.mode = 'classic';
    this.phase = 'lobby';
    this.players = new Map();
    this.conns = new Map();
    this.chat = [];
    this.players.set('host', { id:'host', name:profile.name, avatar:profile.avatar, isHost:true, isBot:false, lines:0 });
    this.connect();
  }
  connect(){
    try { this.peer = new Peer(peerIdFor(this.code)); }
    catch(e){ toast('مشكلة في الاتصال — جربي تاني'); goHome(); return; }
    this.peer.on('open', () => this.renderLobby());
    this.peer.on('connection', conn => {
      conn.on('data', m => this.onData(conn, m));
      conn.on('close', () => this.dropPlayer(conn));
      conn.on('error', () => {});
    });
    this.peer.on('error', e => {
      if(e.type === 'unavailable-id'){ this.code = genCode(); this.connect(); }
      else if(e.type === 'network'){ toast('النت ضعيف… بنعيد الاتصال 📶'); }
    });
  }
  broadcast(msg){ this.conns.forEach(c => { try{ c.send(msg); }catch(e){} }); }
  publicPlayers(){
    return [...this.players.values()].map(p => ({ id:p.id, name:p.name, avatar:p.avatar, isHost:p.isHost, isBot:p.isBot, lines:p.lines || 0, won:!!p.won, rank:p.rank || null }));
  }
  broadcastState(exceptConn, youPid){
    this.conns.forEach((c, pid) => {
      if(c === exceptConn) return;
      try{ c.send({ t:'state', players:this.publicPlayers(), mode:this.mode, phase:this.phase, you:pid }); }catch(e){}
    });
  }
  sys(text){
    const m = { kind:'system', text };
    this.chat.push(m); if(this.chat.length > 120) this.chat.shift();
    this.broadcast({ t:'sys', text });
    if(this.phase === 'lobby'){ if(this._lobbyChatRender) this._lobbyChatRender(); }
    else if(this.gameUI) this.gameUI.pushChat(m);
  }
  pushChat(m){
    this.chat.push(m); if(this.chat.length > 120) this.chat.shift();
    if(this.phase === 'lobby'){ if(this._lobbyChatRender) this._lobbyChatRender(); }
    else if(this.gameUI) this.gameUI.pushChat(m);
  }
  sendChat(text){ const m = { kind:'user', pid:'host', name:profile.name, avatar:profile.avatar, text }; this.broadcast({ t:'chat', pid:'host', name:profile.name, avatar:profile.avatar, text }); this.pushChat(m); }
  sendEmote(e){ const m = { kind:'emote', pid:'host', name:profile.name, avatar:profile.avatar, text:e }; this.broadcast({ t:'chat', pid:'host', name:profile.name, avatar:profile.avatar, text:e, emote:true }); this.pushChat(m); }

  onData(conn, m){
    if(!m || typeof m !== 'object') return;
    switch(m.t){
      case 'hello': {
        if(this.phase !== 'lobby'){ try{ conn.send({ t:'busy' }); }catch(e){} return; }
        if(this.players.size >= 8){ try{ conn.send({ t:'full' }); }catch(e){} return; }
        let pid = 'p' + rnd(1000000);
        while(this.players.has(pid) || this.conns.has(pid)) pid = 'p' + rnd(1000000);
        conn._pid = pid;
        this.conns.set(pid, conn);
        const name = String(m.name || 'لاعبة').slice(0,14), avatar = String(m.avatar || '🎉').slice(0,4);
        this.players.set(pid, { id:pid, name, avatar, isHost:false, isBot:false, lines:0 });
        this.sys(`${avatar} ${name} دخلت الغرفة 👋`);
        try{ conn.send({ t:'state', players:this.publicPlayers(), mode:this.mode, phase:this.phase, you:pid }); }catch(e){}
        this.broadcastState(conn);
        if(this.phase === 'lobby' && $('#lobscr')) this.renderLobby();
        break;
      }
      case 'mark': {
        if(this.phase !== 'playing') break;
        const p = this.players.get(conn._pid); if(!p || !p.card) break;
        const cell = m.cell | 0; if(cell < 0 || cell > 24) break;
        const num = p.card[cell] && p.card[cell].n;
        if(!num || p.marked[cell]) break;
        if(!this.balls.some(b => b.n === num)) break;
        p.marked[cell] = true;
        this.updateLines(p);
        break;
      }
      case 'bingo': this.tryDeclare(conn._pid); break;
      case 'chat': {
        const p = this.players.get(conn._pid); if(!p) break;
        const text = String(m.text || '').slice(0,200); if(!text) break;
        const out = { t:'chat', pid:p.id, name:p.name, avatar:p.avatar, text };
        this.broadcast(out);
        this.pushChat({ kind:'user', pid:p.id, name:p.name, avatar:p.avatar, text });
        break;
      }
      case 'emote': {
        const p = this.players.get(conn._pid); if(!p) break;
        const e = String(m.emote || '').slice(0,8); if(!e) break;
        this.broadcast({ t:'chat', pid:p.id, name:p.name, avatar:p.avatar, text:e, emote:true });
        this.pushChat({ kind:'emote', pid:p.id, name:p.name, avatar:p.avatar, text:e });
        break;
      }
    }
  }
  dropPlayer(conn){
    const pid = conn._pid; if(!pid) return;
    const p = this.players.get(pid); if(!p) return;
    this.players.delete(pid); this.conns.delete(pid);
    this.sys(`${p.avatar} ${p.name} خرجت من الغرفة`);
    if(this.phase === 'lobby'){ this.broadcastState(); if($('#lobscr')) this.renderLobby(); }
    else this.gameUI && this.gameUI.setChips(this.publicPlayers(), this.myId);
  }
  addBot(){
    if(this.phase !== 'lobby' || this.players.size >= 8) return;
    const used = new Set([...this.players.values()].map(p => p.name));
    const names = ['سوسو','نونو','كوكو','ميما','توتو','لولو','زيزي','ميمي'];
    const avatars = ['🐱','🦄','🐸','🐰','🐼','🐯','🦋','🐤'];
    const name = names.find(n => !used.has(n)) || 'بوت';
    const id = 'bot' + rnd(100000);
    this.players.set(id, { id, name, avatar:avatars[rnd(avatars.length)], isHost:false, isBot:true, lines:0 });
    this.sys(`${name} البوت دخلت الغرفة 🤖`);
    this.renderLobby();
  }
  setMode(mode){
    if(this.phase !== 'lobby' || !MODES[mode]) return;
    this.mode = mode;
    this.sys(`النمط اتغير: ${MODES[mode].icon} ${MODES[mode].title}`);
    this.renderLobby();
  }
  renderLobby(){
    app.innerHTML = lobbyHTML(this, true);
    $('#lobleave').onclick = () => { sfx.click(); mpRoom = null; this.leave(); goHome(); };
    $('#lobcopy').onclick = () => {
      (navigator.clipboard ? navigator.clipboard.writeText(this.code) : Promise.reject())
        .then(() => { toast('اتنسخ الكود ✓'); sfx.coins(); })
        .catch(() => toast('الكود: ' + this.code));
    };
    app.querySelectorAll('[data-mmode]').forEach(b => b.onclick = () => { sfx.click(); this.setMode(b.dataset.mmode); });
    const botBtn = $('#lobbot'); if(botBtn) botBtn.onclick = () => { sfx.click(); this.addBot(); };
    $('#lobstart').onclick = () => { sfx.click(); this.startGame(); };
    bindLobbyChat(this, 'host');
  }
  lobbyChatAppend(){ this._lobbyChatRender && this._lobbyChatRender(); }
  startGame(){
    if(this.phase !== 'lobby') return;
    if(this.players.size < 2){ toast('محتاجة لاعيبة أكتر — ضيفي بوت أو استني صاحباتك'); return; }
    this.phase = 'playing';
    this.pool = shuffle(range25()); this.idx = 0; this.balls = [];
    this.players.forEach(p => { p.card = genCard(); p.marked = mkMarked(); p.lines = 0; p.won = false; });
    const cfg = MODES[this.mode];
    this.conns.forEach((conn, pid) => {
      const p = this.players.get(pid);
      try{ conn.send({ t:'start', card:p.card, mode:this.mode, cfg, players:this.publicPlayers(), myId:pid }); }catch(e){}
    });
    // host UI
    this.gameUI = new GameUI(
      { ...cfg, roundTxt:'', autoMark: () => profile.autoMark, myId:'host' },
      {
        onBack: () => { mpRoom = null; this.leave(); goHome(); },
        onToggleAuto: () => { profile.autoMark = !profile.autoMark; saveProfile(); this.gameUI.updateModeChip(); },
        onCellTap: i => this.selfTap(i),
        onBingo: () => { const ok = this.tryDeclare('host'); return ok; },
        onPowerup: k => this.selfPowerup(k),
        ballCount: () => this.balls.length,
      }
    );
    this.gameUI.setCard(this.players.get('host').card, this.players.get('host').marked);
    this.gameUI.setAvatars(this.publicPlayers());
    this.gameUI.ensureChatBtn();
    this.gameUI.setChips(this.publicPlayers(), 'host');
    this.sys(`بدأت الجولة! ${cfg.icon} ${cfg.title} — يلا نشطب! 🖊️`);
    this.timer = setInterval(() => this.draw(), cfg.interval);
    setTimeout(() => this.draw(), 1100);
  }
  draw(){
    if(this.phase !== 'playing') return;
    if(this.idx >= this.pool.length){ this.endNoWinner(); return; }
    const n = this.pool[this.idx], letter = letterFor(n);
    this.balls.push({ n, letter }); this.idx++;
    this.broadcast({ t:'ball', n, letter });
    this.gameUI.onBall(n, letter);
    // host self auto-mark
    if(profile.autoMark){
      const me = this.players.get('host');
      const c = me.card.findIndex(x => x.n === n);
      if(c >= 0 && !me.marked[c]){ me.marked[c] = true; this.gameUI.markCell(c); this.updateLines(me); }
    }
    // bots
    this.players.forEach(p => {
      if(!p.isBot) return;
      const c = p.card.findIndex(x => x.n === n);
      if(c >= 0 && !p.marked[c]) p.marked[c] = true;
      this.updateLines(p);
    });
    // bot bingo?
    const cfg = MODES[this.mode];
    this.players.forEach(p => {
      if(!p.isBot || p.winScheduled) return;
      const botWon = cfg.pattern === 'bingo5' ? countLines(p.marked) >= 5 : p.marked.every(Boolean);
      if(botWon){
        p.winScheduled = true;
        setTimeout(() => { if(this.phase === 'playing') this.tryDeclare(p.id); }, 1500 + rnd(2500));
      }
    });
    if(this.idx >= this.pool.length){
      this.endT = setTimeout(() => { if(this.phase === 'playing') this.endNoWinner(); }, cfg.interval + 2500);
    }
  }
  updateLines(p){
    const nl = countLines(p.marked || []);
    if(nl === p.lines) return;
    const before = p.lines;
    p.lines = nl;
    this.broadcast({ t:'lines', pid:p.id, lines:nl });
    if(this.gameUI){
      this.gameUI.setChips(this.publicPlayers(), this.myId);
      if(p.id === 'host') this.gameUI.onLines(nl); // my own BINGO tracker
    }
    const cfg = MODES[this.mode];
    if(cfg.pattern === 'bingo5' && nl > before && nl <= 5){
      if(nl === 5) this.sys(`${p.avatar} ${p.name} كمّلت حروف BINGO! محتاجة تدوسي الزرار! 🚨`);
      else this.sys(`${p.avatar} ${p.name} خدت حرف ${LETTERS[nl-1]} (${nl}/5)`);
    }
  }
  selfTap(i){
    if(this.phase !== 'playing' || profile.autoMark) return;
    const me = this.players.get('host');
    const num = me.card[i] && me.card[i].n;
    if(!num || me.marked[i]) return;
    if(!this.balls.some(b => b.n === num)){ sfx.click(); toast('الرقم ده لسه ماتقالش ✋'); return; }
    me.marked[i] = true;
    this.gameUI.markCell(i);
    this.updateLines(me);
  }
  selfPowerup(k){
    const me = this.players.get('host');
    if(k === 'hint'){
      const bl = bestLine(me.marked);
      if(!bl) return false;
      this.gameUI.showHint(bl.line);
    } else if(k === 'lucky'){
      if(MODES[this.mode].pattern === 'fullhouse') return false;
      const cands = me.marked.map((m,i) => (!m && me.card[i].n !== 0) ? i : -1).filter(i => i >= 0);
      if(!cands.length) return false;
      const cell = cands[rnd(cands.length)];
      me.marked[cell] = true;
      this.gameUI.markLucky(cell);
      this.updateLines(me);
    }
    return true;
  }
  tryDeclare(pid){
    if(this.phase !== 'playing') return false;
    const p = this.players.get(pid); if(!p) return false;
    const ok = MODES[this.mode].pattern === 'bingo5' ? countLines(p.marked) >= 5 : p.marked.every(Boolean);
    if(!ok){
      const c = this.conns.get(pid);
      if(c) c.send({ t:'bingoBad' });
      return false;
    }
    this.declareWinner(p);
    return true;
  }
  declareWinner(p){
    if(this.phase !== 'playing') return;
    this.phase = 'results';
    clearInterval(this.timer); clearTimeout(this.endT);
    p.won = true;
    const ps = [...this.players.values()].sort((a,b) => (b.won?1:0) - (a.won?1:0) || b.lines - a.lines);
    ps.forEach((x,i) => x.rank = i + 1);
    const cells = LINES.filter(l => l.every(i => p.marked[i])).flat();
    this.broadcast({ t:'winner', pid:p.id, name:p.name, cells, results:this.publicPlayers() });
    this.sys(`${p.avatar} ${p.name} كسبت الجولة! بينجووو! 🎉`);
    this.gameUI.setChips(this.publicPlayers(), this.myId);
    if(p.id === 'host'){
      this.gameUI.setWinCells(cells);
      this.gameUI.finish();
      sfx.win(); confetti();
    } else {
      this.gameUI.finish();
      sfx.buzz();
    }
    this.showWinnerOverlay({ pid:p.id, name:p.name, results:this.publicPlayers() });
  }
  endNoWinner(){
    if(this.phase !== 'playing') return;
    this.phase = 'results';
    clearInterval(this.timer); clearTimeout(this.endT);
    const ps = [...this.players.values()].sort((a,b) => b.lines - a.lines);
    ps.forEach((x,i) => x.rank = i + 1);
    this.broadcast({ t:'winner', pid:null, name:null, cells:[], results:this.publicPlayers() });
    this.sys('خلصت الكرات ومحدش كسب — تعادل! 😅');
    this.gameUI.finish();
    this.showWinnerOverlay({ pid:null, name:null, results:this.publicPlayers() });
  }
  showWinnerOverlay(m){
    const iWon = m.pid === 'host';
    const lines = this.players.get('host').lines;
    const rewards = rankReward(m.pid === null ? 99 : (this.players.get('host').rank || 99));
    let xp = rewards.xp + Math.min(lines,8)*2, coins = rewards.coins;
    if(this.gameUI.doubleActive && iWon){ xp *= 2; coins *= 2; }
    const leveled = addReward(xp, coins);
    saveProfile();
    if(iWon) profile.wins++;
    profile.games++;
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="modal glass pop">
      <div style="font-size:54px;margin-bottom:4px">${iWon ? '🏆' : m.pid ? '🎉' : '🤝'}</div>
      <h2 style="font-size:20px;font-weight:900;${iWon ? 'color:#fcd34d' : ''}">${iWon ? 'انتِ كسبتي! بينجووو!' : m.pid ? `${esc(m.name)} كسبت الجولة!` : 'تعادل!'}</h2>
      ${leveled ? `<div style="color:#4ade80;font-weight:900;font-size:12px;margin-top:4px">لفل أب! مستوى ${levelFromXp(profile.xp).level} 🎊</div>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
        <div style="background:rgba(255,255,255,.08);border-radius:16px;padding:10px"><div style="font-size:10px;color:rgba(255,255,255,.5)">XP</div><div style="color:#f0abfc;font-weight:900">+${xp}</div></div>
        <div style="background:rgba(255,255,255,.08);border-radius:16px;padding:10px"><div style="font-size:10px;color:rgba(255,255,255,.5)">عملات</div><div style="color:#fcd34d;font-weight:900">+${coins} 🪙</div></div>
      </div>
      <div style="margin-top:12px;display:flex;flex-direction:column;gap:5px;text-align:right">
        ${m.results.slice().sort((a,b) => (a.rank||9)-(b.rank||9)).map((r,i) => `
          <div style="background:${r.id === 'host' ? 'rgba(236,72,153,.25)' : 'rgba(255,255,255,.06)'};border-radius:12px;padding:7px 12px;display:flex;align-items:center;gap:8px">
            <b style="width:20px;text-align:center">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</b>
            <span>${r.avatar}</span>
            <span style="flex:1;font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}${r.id==='host'?' <small style="color:#f9a8d4">(أنتي)</small>':''}</span>
            <span class="progchip">${Math.min(r.lines,5)}/5</span>
          </div>`).join('')}
      </div>
      <button class="btn btn-green" id="wlobby" style="width:100%;margin-top:14px">🏠 لوبي جديد</button>
    </div>`;
    document.body.appendChild(ov);
    $('#wlobby').onclick = () => { sfx.click(); ov.remove(); this.toLobby(); };
  }
  toLobby(){
    this.phase = 'lobby';
    this.gameUI = null;
    this.broadcast({ t:'lobby' });
    this.renderLobby();
  }
  leave(){
    clearInterval(this.timer); clearTimeout(this.endT);
    try{ this.peer && this.peer.destroy(); }catch(e){}
    this.gameUI && this.gameUI.removeChatBtn();
  }
}

function rankReward(rank){
  if(rank === 1) return { xp:50, coins:100 };
  if(rank === 2) return { xp:25, coins:40 };
  if(rank === 3) return { xp:15, coins:25 };
  return { xp:8, coins:10 };
}

/* ---------- GUEST ---------- */
class GuestMP {
  constructor(code){
    this.isHost = false;
    this.code = code;
    this.myId = null;
    this.players = [];
    this.mode = 'classic';
    this.phase = 'lobby';
    this.chat = [];
    this.connect();
  }
  connect(){
    try { this.peer = new Peer(); }
    catch(e){ this.fail('مشكلة في الاتصال — جربي تاني'); return; }
    this.peer.on('open', () => {
      this.conn = this.peer.connect(peerIdFor(this.code), { reliable:true });
      this.conn.on('open', () => this.conn.send({ t:'hello', name:profile.name, avatar:profile.avatar }));
      this.conn.on('data', m => this.onData(m));
      this.conn.on('close', () => this.hostLost());
      this.conn.on('error', () => {});
    });
    this.peer.on('error', e => {
      if(e.type === 'peer-unavailable') this.fail('مفيش غرفة بالكود ده — اتأكدي منه وقولي لصاحبتك تفتح اللعبة');
      else this.fail('مشكلة اتصال — جربي تاني 📶');
    });
    this.joinT = setTimeout(() => { if(!this.myId) this.fail('الغرفة ماردتش… اتأكدي من الكود والنت وجربي تاني'); }, 10000);
  }
  fail(msg){
    clearTimeout(this.joinT);
    try{ this.peer && this.peer.destroy(); }catch(e){}
    app.innerHTML = `<div class="screen" style="display:flex;align-items:center;justify-content:center;min-height:100dvh">
      <div class="glass modal pop">
        <div style="font-size:46px">😕</div>
        <p style="font-weight:900;margin:8px 0 4px">${esc(msg)}</p>
        <button class="btn btn-main" id="failback" style="width:100%;margin-top:12px">رجوع</button>
      </div>
    </div>`;
    mpRoom = null;
    $('#failback').onclick = () => { sfx.click(); goHome(); };
  }
  hostLost(){
    if(this.closing) return;
    this.closing = true;
    toast('المضيفة خرجت من اللعبة 😢');
    mpRoom = null;
    this.leave();
    goHome();
  }
  leave(){
    this.closing = true;
    clearTimeout(this.joinT);
    try{ this.conn && this.conn.close(); }catch(e){}
    try{ this.peer && this.peer.destroy(); }catch(e){}
    this.gameUI && this.gameUI.removeChatBtn();
  }
  sendChat(text){ this.conn && this.conn.send({ t:'chat', text }); }
  sendEmote(e){ this.conn && this.conn.send({ t:'emote', emote:e }); }
  pushChat(m){
    this.chat.push(m); if(this.chat.length > 120) this.chat.shift();
    if(this.phase === 'lobby'){ if(this._lobbyChatRender) this._lobbyChatRender(); }
    else if(this.gameUI) this.gameUI.pushChat(m);
  }
  onData(m){
    if(!m || typeof m !== 'object') return;
    switch(m.t){
      case 'busy': this.fail('الجولة شغالة دلوقتي — استني خلصانتها'); break;
      case 'full': this.fail('الغرفة مليانة (٨ لاعيبة)'); break;
      case 'state': {
        this.players = m.players; this.mode = m.mode; this.phase = m.phase;
        if(!this.myId && m.you){
          this.myId = m.you; clearTimeout(this.joinT);
          this.renderLobby();
        } else if(this.myId){
          this.updateLobby();
        }
        break;
      }
      case 'start': this.openGame(m); break;
      case 'ball': {
        if(!this.gameUI) break;
        this.gameUI.onBall(m.n, m.letter);
        if(profile.autoMark){
          const i = this.gameUI.card.findIndex(x => x.n === m.n);
          if(i >= 0 && !this.marked[i]){
            this.marked[i] = true;
            this.gameUI.markCell(i);
            this.gameUI.onLines(countLines(this.marked));
            this.conn && this.conn.send({ t:'mark', cell:i });
          }
        }
        break;
      }
      case 'lines': {
        const p = this.players.find(x => x.id === m.pid);
        if(p){
          p.lines = m.lines;
          if(this.gameUI){
            this.gameUI.setChips(this.players, this.myId);
            if(m.pid === this.myId) this.gameUI.onLines(m.lines); // my own BINGO tracker
          }
        }
        break;
      }
      case 'bingoBad': this.gameUI && this.gameUI.bingoInvalid(); break;
      case 'winner': this.phase = 'results'; this.showWinner(m); break;
      case 'lobby': this.phase = 'lobby'; if(this.gameUI){ this.gameUI.removeChatBtn(); this.gameUI = null; } this.renderLobby(); break;
      case 'chat': this.pushChat(m.emote ? { kind:'emote', pid:m.pid, name:m.name, avatar:m.avatar, text:m.text } : { kind:'user', pid:m.pid, name:m.name, avatar:m.avatar, text:m.text }); break;
      case 'sys': this.pushChat({ kind:'system', text:m.text }); break;
    }
  }
  updateLobby(){
    if(this.phase === 'lobby' && $('#lobscr')){
      const ps = $('#loblist'); 
      app.querySelectorAll('.plist')[0] && (app.querySelectorAll('.plist')[0].innerHTML = this.players.map(p => `
        <div class="pitem"><span style="font-size:22px">${p.avatar}</span>
          <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)} ${p.isHost ? '👑' : ''}${p.isBot ? '<small style="color:rgba(255,255,255,.4)"> بوت</small>' : ''}</div></div>
        </div>`).join(''));
      const cnt = $('#lobcount'); if(cnt) cnt.textContent = `👩‍👩‍👧 اللاعيبة (${this.players.length}/8)`;
    }
  }
  renderLobby(){
    const r = { code:this.code, players:this.players, mode:this.mode, chat:this.chat };
    app.innerHTML = lobbyHTML(r, false).replace('👩‍👩‍👧 اللاعيبة', '<span id="lobcount">👩‍👩‍👧 اللاعيبة</span>');
    // fix count text
    const cnt = $('#lobcount'); if(cnt) cnt.textContent = `👩‍👩‍👧 اللاعيبة (${this.players.length}/8)`;
    $('#lobleave').onclick = () => { sfx.click(); mpRoom = null; this.leave(); goHome(); };
    $('#lobcopy').onclick = () => {
      (navigator.clipboard ? navigator.clipboard.writeText(this.code) : Promise.reject())
        .then(() => { toast('اتنسخ الكود ✓'); sfx.coins(); })
        .catch(() => toast('الكود: ' + this.code));
    };
    const self = this;
    // chat binding against guest room API
    this._lobbyChatRender = () => {
      const box = $('#lobbymsgs');
      if(!box) return;
      box.innerHTML = this.chat.map(m => chatMsgHTML(m, self.myId)).join('');
      box.scrollTop = box.scrollHeight;
    };
    this._lobbyChatRender();
    const send = () => { const v = $('#lobinput').value.trim(); if(v){ this.sendChat(v); $('#lobinput').value = ''; } };
    $('#lobsend').onclick = send;
    $('#lobinput').addEventListener('keydown', e => e.key === 'Enter' && send());
    document.querySelectorAll('[data-le]').forEach(b => b.onclick = () => this.sendEmote(b.dataset.le));
  }
  openGame(m){
    this.phase = 'playing';
    this.mode = m.mode;
    this.players = m.players;
    this.cfg = m.cfg;
    const self = this;
    this.gameUI = new GameUI(
      { ...m.cfg, roundTxt:'', autoMark: () => profile.autoMark, myId:self.myId },
      {
        onBack: () => { mpRoom = null; self.leave(); goHome(); },
        onToggleAuto: () => { profile.autoMark = !profile.autoMark; saveProfile(); self.gameUI.updateModeChip(); },
        onCellTap: i => self.tap(i),
        onBingo: () => { self.conn && self.conn.send({ t:'bingo' }); return 'pending'; },
        onPowerup: k => self.powerup(k),
        ballCount: () => self.gameUI ? self.gameUI.balls.length : 0,
      }
    );
    this.marked = mkMarked();
    this.gameUI.setCard(m.card, this.marked);
    this.gameUI.setAvatars(m.players);
    this.gameUI.ensureChatBtn();
    this.gameUI.setChips(m.players, this.myId);
    sfx.magic();
  }
  tap(i){
    const num = this.gameUI.card[i] && this.gameUI.card[i].n;
    if(!num || this.marked[i]) return;
    if(!this.gameUI.balls.some(b => b.n === num)){ sfx.click(); toast('الرقم ده لسه ماتقالش ✋'); return; }
    this.marked[i] = true;
    this.gameUI.markCell(i);
    this.gameUI.onLines(countLines(this.marked));
    this.conn && this.conn.send({ t:'mark', cell:i });
  }
  powerup(k){
    if(k === 'hint'){
      const bl = bestLine(this.marked);
      if(!bl) return false;
      this.gameUI.showHint(bl.line);
    } else if(k === 'lucky'){
      if(this.cfg.pattern === 'fullhouse') return false;
      const cands = this.marked.map((m,i) => (!m && this.gameUI.card[i].n !== 0) ? i : -1).filter(i => i >= 0);
      if(!cands.length) return false;
      const cell = cands[rnd(cands.length)];
      this.marked[cell] = true;
      this.gameUI.markLucky(cell);
      this.gameUI.onLines(countLines(this.marked));
      this.conn && this.conn.send({ t:'mark', cell });
    }
    return true;
  }
  showWinner(m){
    this.phase = 'results';
    if(this.gameUI){
      if(m.pid === this.myId && m.cells) this.gameUI.setWinCells(m.cells);
      this.gameUI.finish();
    }
    const iWon = m.pid === this.myId;
    const me = m.results.find(r => r.id === this.myId);
    const lines = me ? me.lines : 0;
    const rewards = rankReward(m.pid === null ? 99 : (me && me.rank) || 99);
    let xp = rewards.xp + Math.min(lines,8)*2, coins = rewards.coins;
    if(this.gameUI && this.gameUI.doubleActive && iWon){ xp *= 2; coins *= 2; }
    const leveled = addReward(xp, coins);
    saveProfile();
    if(iWon){ profile.wins++; sfx.win(); confetti(); }
    else sfx.buzz();
    profile.games++;
    const ov = document.createElement('div');
    ov.className = 'overlay';
    const isHost = me && me.isHost;
    ov.innerHTML = `<div class="modal glass pop">
      <div style="font-size:54px;margin-bottom:4px">${iWon ? '🏆' : m.pid ? '🎉' : '🤝'}</div>
      <h2 style="font-size:20px;font-weight:900;${iWon ? 'color:#fcd34d' : ''}">${iWon ? 'انتِ كسبتي! بينجووو!' : m.pid ? `${esc(m.name)} كسبت الجولة!` : 'تعادل!'}</h2>
      ${leveled ? `<div style="color:#4ade80;font-weight:900;font-size:12px;margin-top:4px">لفل أب! مستوى ${levelFromXp(profile.xp).level} 🎊</div>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
        <div style="background:rgba(255,255,255,.08);border-radius:16px;padding:10px"><div style="font-size:10px;color:rgba(255,255,255,.5)">XP</div><div style="color:#f0abfc;font-weight:900">+${xp}</div></div>
        <div style="background:rgba(255,255,255,.08);border-radius:16px;padding:10px"><div style="font-size:10px;color:rgba(255,255,255,.5)">عملات</div><div style="color:#fcd34d;font-weight:900">+${coins} 🪙</div></div>
      </div>
      <div style="margin-top:12px;display:flex;flex-direction:column;gap:5px;text-align:right">
        ${m.results.slice().sort((a,b) => (a.rank||9)-(b.rank||9)).map((r,i) => `
          <div style="background:${r.id === this.myId ? 'rgba(236,72,153,.25)' : 'rgba(255,255,255,.06)'};border-radius:12px;padding:7px 12px;display:flex;align-items:center;gap:8px">
            <b style="width:20px;text-align:center">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</b>
            <span>${r.avatar}</span>
            <span style="flex:1;font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}${r.id===this.myId?' <small style="color:#f9a8d4">(أنتي)</small>':''}</span>
            <span class="progchip">${Math.min(r.lines,5)}/5</span>
          </div>`).join('')}
      </div>
      ${isHost ? '<button class="btn btn-green" id="wlobby" style="width:100%;margin-top:14px">🏠 لوبي جديد</button>' : '<p style="text-align:center;color:rgba(255,255,255,.5);font-size:12px;margin-top:12px">استني المضيفة ترجع اللوبي… ⏳</p>'}
    </div>`;
    document.body.appendChild(ov);
    const wl = $('#wlobby');
    if(wl) wl.onclick = () => { sfx.click(); ov.remove(); this.conn && this.conn.send({ t:'backLobby' }); };
  }
}

/* ============================================================
   Install as app (PWA)
   ============================================================ */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('اتسطبت! أيقونة Bingo Party على شاشتك الرئيسية 🎉'); });
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function showInstallGuide(){
  if(isStandalone()){ toast('اللعبة متسطبة أصلاً كتطبيق ✅'); return; }
  if(deferredInstall){ deferredInstall.prompt(); deferredInstall = null; return; }
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && 'ontouchend' in document);
  const steps = iOS ? [
    'افتحي اللعبة في متصفح Safari',
    'دوسي زرار المشاركة ⬆️ (تحت في النص)',
    'اختاري «إضافة إلى الشاشة الرئيسية»',
    'دوسي «إضافة» — وهتلاقي أيقونة اللعبة 🎉'
  ] : [
    'افتحي اللعبة في متصفح Chrome',
    'دوسي القائمة ⋮ فوق على اليمين',
    'اختاري «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»',
    'دوسي «تثبيت» — وهتلاقي أيقونة اللعبة 🎉'
  ];
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal glass pop" style="text-align:right">
    <div style="font-size:44px;text-align:center">📲</div>
    <h2 style="font-size:18px;font-weight:900;text-align:center">نصّبي Bingo Party كتطبيق</h2>
    <p style="color:rgba(255,255,255,.6);font-size:12px;margin-top:4px;text-align:center">هتظهر بأيقونتها زي أي تطبيق — وتفتح من غير إنترنت</p>
    <div style="margin-top:14px;display:flex;flex-direction:column;gap:6px">
      ${steps.map((s,i) => `<div style="background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center"><b style="width:22px;height:22px;background:rgba(236,72,153,.5);border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0">${i+1}</b><span style="font-size:13px;font-weight:700">${s}</span></div>`).join('')}
    </div>
    <button class="btn btn-main" style="width:100%;margin-top:14px">تمام ✅</button>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector('button').onclick = () => { sfx.click(); ov.remove(); };
}

window.addEventListener('beforeunload', () => { if(mpRoom) mpRoom.leave(); });
if(profile.name) goHome();
else showOnboarding();
